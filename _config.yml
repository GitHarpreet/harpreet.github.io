# Site Info
title:              "Harpreet Singh"
description:        "PhD student, Department of Economics, McGill University"
author_name:        "Harpreet Singh"
logo_url:           https://github.com/GitHarpreet.png # GitHub avatar; swap for your own headshot URL if you'd like

# Site Settings
url:                https://GitHarpreet.github.io # main url
baseurl:            /harpreetsingh
permalink:          /:title # Post permalink
timezone:           America/Toronto # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
mathjax:            true  # enables support for mathjax - set to 'false' to disable

# Site Build
highlighter:        rouge
markdown:           kramdown
kramdown:
    input:          GFM
sass:
    style:          :compressed

# Other Params
include:            [ "robots.txt" ]
exclude:            [ "LICENSE", "README.md", "CNAME", "vendor", "Gemfile", "script" ]
plugins:
  - jekyll-sitemap
collections:
  researches:
    output: true
    permalink: /researches/:name
  projects:
    output: true
    permalink: /projects/:name
  talks:
    output: true
    permalink: /talks/:name
  blog:
    output: true
    permalink: /blog/:name

defaults:
  -
    scope:
      path:         ""
    values:
      layout:       "null"
  -
    scope:
      type:         "pages"
    values:
      layout:       "page"
  -
    scope:
      type:         "posts"
    values:
      layout:       "post"
  -
    scope:
      type:         "researches"
    values:
      layout:       "research-post"
  -
    scope:
      type:         "projects"
    values:
      layout:       "post"
  -
    scope:
      type:         "talks"
    values:
      layout:       "post"
  -
    scope:
      type:         "blog"
    values:
      layout:       "post"
